AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Job Posting Reality Score (JPRS) V1 stack. Folds phases P2-P7 into one deploy:
  S3 (single bucket, prefix-partitioned, no versioning), SQS collect-queue + DLQ,
  EventBridge Scheduler (collect + assemble), four Lambdas (enumerate/collector/differ/report)
  each with its own least-privilege role + shared permissions boundary, an optional
  feature-flagged narrator Lambda, a Standard Step Functions assembler (Map + Retry + Catch),
  CloudWatch alarms A1-A7 -> SNS, finite log retention, and no always-on compute.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  BucketName:
    Type: String
    Default: jprs-prod-bw-20260731
    Description: Name of the single JPRS data bucket (prefix-partitioned, no versioning).
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
  AlertEmail:
    Type: String
    Description: Email that receives ops alarms A1-A7.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  DigestRecipient:
    Type: String
    Description: Email that receives the daily digest report (SES). Must be a verified SES identity while SES is in sandbox.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  SesSender:
    Type: String
    Description: Verified SES sender identity used as the digest From address.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  CollectCron:
    Type: String
    Default: cron(0 7 * * ? *)
    Description: EventBridge Scheduler expression for the daily collect run (in TimeZone).
  AssembleCron:
    Type: String
    Default: cron(0 9 * * ? *)
    Description: EventBridge Scheduler expression for the daily assemble run (collect + offset, in TimeZone).
  TimeZone:
    Type: String
    Default: America/New_York
    Description: IANA timezone applied to both schedules.
  DiscoveryCron:
    Type: String
    Default: cron(5 7 * * ? *)
    Description: >-
      EventBridge Scheduler expression for the daily open-market discovery pass (in TimeZone).
      Runs a few minutes AFTER CollectCron so the RUN_OPEN manifest already exists, and well before
      AssembleCron. The existing collect and assemble schedules are unchanged.
  DiscoveryProviders:
    Type: String
    Default: ''
    Description: >-
      Optional comma-separated discovery provider subset (remotive,remoteok,jobicy,himalayas,hn_hiring,adzuna).
      Empty means every keyless provider; credential-gated providers stay gated until their secret
      exists and are named in the coverage receipt rather than silently skipped.
  SecretsSsmPrefix:
    Type: String
    Default: /jprs/secrets
    Description: >-
      SSM path holding credential-gated API keys (e.g. /jprs/secrets/ADZUNA_APP_ID). Read with
      decryption at invoke time. Deliberately NOT template parameters: a secret passed through
      CloudFormation is retained in change sets and console history.
  ResolveCareersUrls:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether discovery may follow an aggregator apply link to find the employer's own careers page.
      Required for source growth, because the keyless feeds do not publish employer board URLs.
      Every hop is re-validated against the SSRF address rules. OFF until the operator approves it.
  EnableNarrator:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Feature flag for the optional Bedrock narrator Lambda. OFF by default and never on the daily path.

Conditions:
  NarratorEnabled: !Equals [!Ref EnableNarrator, 'true']

# ---------------------------------------------------------------------------
# Globals (shared Lambda config)
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Timeout: 30
    MemorySize: 256
    CodeUri: ../
    PermissionsBoundary: !Ref PermissionsBoundaryPolicy
    Tags:
      Project: job-posting-reality-score
      Env: v1
      ManagedBy: brett
    Environment:
      Variables:
        JPRS_BUCKET: !Ref BucketName
        METRIC_NAMESPACE: JPRS
        JPRS_COMPANIES_SSM: /jprs/companies

Resources:

  # =========================================================================
  # Shared IAM permissions boundary (ceiling on every JPRS execution role).
  # =========================================================================
  PermissionsBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: jprs-permissions-boundary
      Description: Shared ceiling for every JPRS execution role. Scopes to project resources; denies IAM/EC2/RDS and any make-public action.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowProjectScopedDataPlane
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - states:StartExecution
              - states:DescribeExecution
              - lambda:InvokeFunction
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - !Sub arn:aws:s3:::${BucketName}
              - !Sub arn:aws:s3:::${BucketName}/*
              - !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:jprs-*
              - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:jprs-*
              - !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:jprs-*:*
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:jprs-*
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jprs/*
          - Sid: AllowProjectObservabilityAndDelivery
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - cloudwatch:PutMetricData
              - sns:Publish
              - ses:SendEmail
              - ses:SendRawEmail
              - bedrock:InvokeModel
            Resource: '*'
          - Sid: DenyPrivilegeEscalationAndOutOfScopeInfra
            Effect: Deny
            Action:
              - iam:*
              - ec2:*
              - rds:*
              - elasticache:*
              - es:*
              - eks:*
              - organizations:*
              - account:*
              - s3:PutBucketPublicAccessBlock
              - s3:PutAccountPublicAccessBlock
              - s3:PutBucketPolicy
              - s3:PutBucketAcl
              - s3:DeleteBucketPolicy
              - kms:ScheduleKeyDeletion
              - kms:DisableKey
            Resource: '*'

  # =========================================================================
  # S3 data bucket (single bucket, prefix-partitioned, NO versioning)
  # =========================================================================
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versioning intentionally omitted => OFF (operator hard rule).
      # Minimal lifecycle: only abort incomplete multipart uploads (no retention ceremony).
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-7d
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: job-posting-reality-score }
        - { Key: Env, Value: v1 }
        - { Key: ManagedBy, Value: brett }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub arn:aws:s3:::${BucketName}
              - !Sub arn:aws:s3:::${BucketName}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          # DenyUnEncryptedPutObject removed: the bucket's default SSE-S3 (BucketEncryption)
          # already encrypts every object, and the app relies on that rather than sending an
          # x-amz-server-side-encryption header — so a header-deny would reject ALL app writes.
          # TLS is still enforced by DenyNonTLS above.

  # =========================================================================
  # SQS: collect-queue + collect-dlq (redrive maxReceiveCount 3, VT 180s = 6x fn)
  # =========================================================================
  CollectDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: jprs-collect-dlq
      MessageRetentionPeriod: 1209600  # 14 days (> source)
      SqsManagedSseEnabled: true
      Tags:
        - { Key: Project, Value: job-posting-reality-score }
        - { Key: Env, Value: v1 }
        - { Key: ManagedBy, Value: brett }

  CollectQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: jprs-collect-queue
      VisibilityTimeout: 180          # 6x the 30s collector timeout
      MessageRetentionPeriod: 345600  # 4 days
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CollectDlq.Arn
        maxReceiveCount: 3
      Tags:
        - { Key: Project, Value: job-posting-reality-score }
        - { Key: Env, Value: v1 }
        - { Key: ManagedBy, Value: brett }

  # =========================================================================
  # CloudWatch log groups (M5: explicit 30-day retention on every function group)
  # =========================================================================
  EnumerateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jprs-enumerate
      RetentionInDays: 30
  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jprs-collector
      RetentionInDays: 30
  DifferLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jprs-differ
      RetentionInDays: 30
  DiscoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jprs-discovery
      RetentionInDays: 30
  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/jprs-report
      RetentionInDays: 30
  NarratorLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: NarratorEnabled
    Properties:
      LogGroupName: /aws/lambda/jprs-narrator
      RetentionInDays: 30

  # =========================================================================
  # Lambdas (each: own least-priv Policies + shared boundary from Globals)
  # M4 prefix split enforced here:
  #   collector -> PutObject raw/*, normalized/*, status/*  (NOT current/*)
  #   differ    -> owns current/*, events/*
  #   report    -> writes reports/*, reads processed
  # =========================================================================

  EnumerateFunction:
    Type: AWS::Serverless::Function
    DependsOn: EnumerateLogGroup
    Properties:
      FunctionName: jprs-enumerate
      Handler: src.enumerate.handler.handler
      Description: M1 backbone. Reads SSM /jprs/companies, writes RUN_OPEN manifest, fans out one SQS message per company.
      Environment:
        Variables:
          JPRS_COLLECT_QUEUE_URL: !Ref CollectQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: EnumerateReadConfig
              Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jprs/*
            - Sid: EnumerateWriteManifest
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${BucketName}/runs/*
            - Sid: EnumerateFanout
              Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt CollectQueue.Arn
            - Sid: EnumerateMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: JPRS

  CollectorFunction:
    Type: AWS::Serverless::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName: jprs-collector
      Handler: src.collector.handler.handler
      Description: SQS-triggered. Fetches one company board, writes raw/, normalized/, status/ (SUCCESS sentinel). Never writes current/.
      Events:
        CollectQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CollectQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: CollectorWriteForwardTiersOnly
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/raw/*
                - !Sub arn:aws:s3:::${BucketName}/normalized/*
                - !Sub arn:aws:s3:::${BucketName}/status/*
            - Sid: CollectorReadStatusForDedupe
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${BucketName}/status/*
            - Sid: CollectorMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: JPRS

  DifferFunction:
    Type: AWS::Serverless::Function
    DependsOn: DifferLogGroup
    Properties:
      FunctionName: jprs-differ
      Handler: src.differ.handler.handler
      Description: Step Functions task. Diffs one company (only if a fresh SUCCESS sentinel exists). Owns current/ + events/.
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: DifferReadInputs
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/raw/*
                - !Sub arn:aws:s3:::${BucketName}/normalized/*
                - !Sub arn:aws:s3:::${BucketName}/status/*
                - !Sub arn:aws:s3:::${BucketName}/runs/*
                - !Sub arn:aws:s3:::${BucketName}/current/*
            - Sid: DifferOwnsCurrentAndEvents
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/current/*
                - !Sub arn:aws:s3:::${BucketName}/events/*
            - Sid: DifferMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: JPRS

  DiscoveryFunction:
    Type: AWS::Serverless::Function
    DependsOn: DiscoveryLogGroup
    Properties:
      FunctionName: jprs-discovery
      Handler: src.discovery.handler.handler
      Timeout: 120
      MemorySize: 512
      Description: >-
        Open-market discovery. Queries employer-INDEPENDENT sources, so a posting from an employer
        nobody has named can arrive. Writes discovery/ plus the same raw/normalized/status forward
        tiers the collector uses. Never writes current/ or events/ (differ-owned).
      Environment:
        Variables:
          JPRS_DISCOVERY_PROVIDERS: !Ref DiscoveryProviders
          JPRS_SECRETS_SSM_PREFIX: !Ref SecretsSsmPrefix
          JPRS_RESOLVE_CAREERS_URLS: !Ref ResolveCareersUrls
          # Company-first financing watchlist (SEC EDGAR Form D full-text search; <= 5 keyless
          # requests per round). Off by default in code so no test or replay reaches the SEC.
          JPRS_COMPANY_SIGNALS: "on"
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: DiscoveryOwnsDiscoveryPrefix
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${BucketName}/discovery/*
            - Sid: DiscoveryWriteForwardTiers
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/raw/*
                - !Sub arn:aws:s3:::${BucketName}/normalized/*
                - !Sub arn:aws:s3:::${BucketName}/status/*
            - Sid: DiscoveryReadOwnStateAndManifest
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/discovery/*
                - !Sub arn:aws:s3:::${BucketName}/runs/*
                - !Sub arn:aws:s3:::${BucketName}/status/*
            - Sid: DiscoveryReadGatedCredentials
              Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters, ssm:GetParametersByPath]
              Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jprs/secrets*
            - Sid: DiscoveryMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: JPRS
            # Without a list grant S3 answers GetObject for a MISSING key with 403, not 404, so a
            # never-written owed-publication object was indistinguishable from a denied one and the
            # first round could not start. Scoped to discovery/ exactly as the report's grant is.
            - Sid: DiscoveryListOwnPrefix
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:aws:s3:::${BucketName}
              Condition:
                StringLike:
                  s3:prefix:
                    - discovery/*

  ReportFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReportLogGroup
    Properties:
      FunctionName: jprs-report
      Handler: src.report.handler.handler
      # Timeout 300 (since 2026-09-30). MemorySize 512 -> 1769 (2026-11-11), on measured evidence:
      #
      # - From 2026-10-10 to 2026-11-11 every scheduled report timed out at 300 s. The population is
      #   now set by discovery's 21-day retention window (1,526 postings on 09-30, 3,143 on 10-09,
      #   4,671 on 11-11), and the report's cost is linear in it: 69.99-100.28 s per 1,000 postings at
      #   512 MB in production. A 21-day steady state of ~4,700 needs ~330-470 s at 512 MB.
      # - Lambda allocates CPU in proportion to memory; 1,769 MB is one full vCPU, 512 MB is 29% of
      #   one. The work is single-threaded CPU (peak memory ~209 MB), so memory buys exactly the CPU
      #   it needs. Replay of the real 2026-11-11 inputs with the 8.9x laptop-to-Lambda factor scaled
      #   to 1,769 MB: 95 s of 298.8 s, 68% headroom; the population can roughly triple first.
      # - Cost: ~1.73 GB x ~95 s x 30 days = ~4,900 GB-s/month against ~3,750 at 512 MB x 250 s.
      #   Both are inside the Lambda free tier; outside it the difference is about two cents a month.
      #
      # The handler also measures its own rate and stops evaluating (newest first) before the
      # reserve it needs to publish, so a population that outgrows even this still produces a report
      # that names what it did not evaluate, instead of no report at all.
      Timeout: 300
      MemorySize: 1769
      Description: Step Functions task. Reads manifest + sentinels (completeness judge) + events, writes reports/, sends the SES digest.
      Environment:
        Variables:
          SES_SENDER: !Ref SesSender
          DIGEST_RECIPIENT: !Ref DigestRecipient
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: ReportReadProcessed
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/current/*
                - !Sub arn:aws:s3:::${BucketName}/events/*
                - !Sub arn:aws:s3:::${BucketName}/status/*
                - !Sub arn:aws:s3:::${BucketName}/runs/*
                - !Sub arn:aws:s3:::${BucketName}/reports/*
                # the discovery coverage receipt the report renders verbatim
                - !Sub arn:aws:s3:::${BucketName}/discovery/*
            - Sid: ReportListStatusAndDeliveryMarkers
              Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:aws:s3:::${BucketName}
              Condition:
                StringLike:
                  s3:prefix:
                    - status/*
                    - reports/*
                    - discovery/*
            - Sid: ReportWriteReportsOnly
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${BucketName}/reports/*
            - Sid: ReportSendDigest
              Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
            - Sid: ReportMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: JPRS

  NarratorFunction:
    Type: AWS::Serverless::Function
    Condition: NarratorEnabled
    DependsOn: NarratorLogGroup
    Properties:
      FunctionName: jprs-narrator
      Handler: src.llm.narrator.narrate
      Description: OPTIONAL, feature-flagged. Bedrock narration of stored evidence only. Non-authoritative; not on the daily path.
      Environment:
        Variables:
          HAIKU_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0
          SONNET_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Sid: NarratorInvokeNamedModelsOnly
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0
            - Sid: NarratorReadEvidence
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${BucketName}/normalized/*
                - !Sub arn:aws:s3:::${BucketName}/events/*
            - Sid: NarratorMetrics
              Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: JPRS

  # =========================================================================
  # Step Functions Standard assembler (Map + Retry + Catch -> report_incomplete)
  # =========================================================================
  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jprs-sfn-assemble-role
      PermissionsBoundary: !Ref PermissionsBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: jprs-sfn-assemble-inline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeAssemblyFunctions
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt DifferFunction.Arn
                  - !GetAtt ReportFunction.Arn
              - Sid: ReadCompanyRegistry
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/jprs/companies

  DailyAssembleStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: jprs-daily-assemble
      Type: STANDARD
      DefinitionUri: statemachine/jprs-daily-assemble.asl.json
      DefinitionSubstitutions:
        DifferFunctionArn: !GetAtt DifferFunction.Arn
        ReportFunctionArn: !GetAtt ReportFunction.Arn
      Role: !GetAtt SfnRole.Arn
      Tags:
        Project: job-posting-reality-score
        Env: v1
        ManagedBy: brett

  # =========================================================================
  # EventBridge Scheduler: two schedules, each with its own least-priv role
  # =========================================================================
  CollectSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jprs-scheduler-collect-role
      PermissionsBoundary: !Ref PermissionsBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-enumerate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EnumerateFunction.Arn

  AssembleSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jprs-scheduler-assemble-role
      PermissionsBoundary: !Ref PermissionsBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: start-assemble
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref DailyAssembleStateMachine

  CollectSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: jprs-collect-daily
      Description: Fires the daily collect run (enumerate -> RUN_OPEN manifest -> SQS fan-out).
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref CollectCron
      ScheduleExpressionTimezone: !Ref TimeZone
      Target:
        Arn: !GetAtt EnumerateFunction.Arn
        RoleArn: !GetAtt CollectSchedulerRole.Arn
        Input: '{"trigger":"collect"}'

  DiscoverySchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: jprs-scheduler-discovery-role
      PermissionsBoundary: !Ref PermissionsBoundaryPolicy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-discovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DiscoveryFunction.Arn

  DiscoverySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: jprs-discovery-daily
      Description: Fires the daily open-market discovery pass, between collect and assemble.
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref DiscoveryCron
      ScheduleExpressionTimezone: !Ref TimeZone
      Target:
        Arn: !GetAtt DiscoveryFunction.Arn
        RoleArn: !GetAtt DiscoverySchedulerRole.Arn
        Input: '{"trigger":"discovery"}'

  AssembleSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: jprs-assemble-daily
      Description: Fires the daily assemble run (collect + offset) -> Step Functions StartExecution.
      State: ENABLED
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: !Ref AssembleCron
      ScheduleExpressionTimezone: !Ref TimeZone
      Target:
        Arn: !Ref DailyAssembleStateMachine
        RoleArn: !GetAtt AssembleSchedulerRole.Arn
        Input: '{"trigger":"assemble"}'

  # =========================================================================
  # SNS ops-alerts topic + email subscription
  # =========================================================================
  OpsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: jprs-ops-alerts
      DisplayName: JPRS Ops Alerts
      Tags:
        - { Key: Project, Value: job-posting-reality-score }
        - { Key: Env, Value: v1 }
        - { Key: ManagedBy, Value: brett }

  OpsAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OpsAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # =========================================================================
  # CloudWatch alarms A1-A7 -> SNS
  # =========================================================================
  A1DlqNotEmpty:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A1-dlq-not-empty
      AlarmDescription: A1 - a message is poison; inspect + redrive the collect DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]
      OKActions: [!Ref OpsAlertTopic]

  A2MissedRun:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A2-missed-run
      AlarmDescription: A2 - collectors did not run today (NO-RUN heartbeat). Custom metric CollectRunSuccess missing/0.
      Namespace: JPRS
      MetricName: CollectRunSuccess
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsAlertTopic]

  A3ReportNotAssembled:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A3-report-not-assembled
      AlarmDescription: A3 - no report today. Custom metric ReportComplete missing/0. Distinguishes assembly failure from a quiet day.
      Namespace: JPRS
      MetricName: ReportComplete
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OpsAlertTopic]

  A4QueueBackingUp:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A4-queue-backing-up
      AlarmDescription: A4 - collectors stuck/throttled. Oldest message age > 3x visibility timeout (540s).
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CollectQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 540
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]

  A5CollectorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A5-collector-errors
      AlarmDescription: A5 - collector code/permission/ATS problem before it reaches the DLQ.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CollectorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]

  A6SourceSuspect:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A6-source-suspect
      AlarmDescription: A6 - a source returned suspiciously few postings; removal events suppressed. Custom metric SourceSuspect.
      Namespace: JPRS
      MetricName: SourceSuspect
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]

  A8DiscoveryErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A8-discovery-errors
      AlarmDescription: >-
        A8 - the discovery pass failed. Discovery is the only path that can surface an employer not
        already in the registry, so its silent failure would quietly reduce the system to a fixed
        watchlist while every other signal still looked healthy.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DiscoveryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]

  A7AssemblyExecutionsFailed:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jprs-A7-assembly-executions-failed
      AlarmDescription: A7 - the assembler hit Catch/unhandled error. Step Functions ExecutionsFailed.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !Ref DailyAssembleStateMachine
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OpsAlertTopic]

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  DataBucketName:
    Description: JPRS data bucket.
    Value: !Ref DataBucket
  CollectQueueUrl:
    Description: Collect queue URL.
    Value: !Ref CollectQueue
  CollectDlqUrl:
    Description: Collect DLQ URL.
    Value: !Ref CollectDlq
  DailyAssembleStateMachineArn:
    Description: Standard assembler state machine ARN.
    Value: !Ref DailyAssembleStateMachine
  DiscoveryFunctionName:
    Description: Open-market discovery function.
    Value: !Ref DiscoveryFunction
  OpsAlertTopicArn:
    Description: SNS topic that fans out alarms A1-A8.
    Value: !Ref OpsAlertTopic
