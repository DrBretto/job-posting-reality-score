# AWS SAM CLI configuration for the JPRS V1 stack.
# Docs: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "jprs-v1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
stack_name = "jprs-v1"
region = "us-east-1"
capabilities = "CAPABILITY_NAMED_IAM"
confirm_changeset = true
resolve_s3 = true
disable_rollback = false
# Override defaults at deploy time with --parameter-overrides, e.g.:
#   sam deploy --parameter-overrides AlertEmail=you@example.com EnableNarrator=false
parameter_overrides = [
  "BucketName=jprs-prod-bw-20260731",
  "TimeZone=America/New_York",
  "CollectCron=cron(0 7 * * ? *)",
  "AssembleCron=cron(0 9 * * ? *)",
  "EnableNarrator=false",
]

[default.delete.parameters]
stack_name = "jprs-v1"
region = "us-east-1"
