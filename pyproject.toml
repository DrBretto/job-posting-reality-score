[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jprs"
version = "1.0.0"
description = "Job Posting Reality Score — low-cost AWS serverless job-posting radar (V1 application)."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.6",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jprs = "src.cli:main"

[tool.setuptools]
packages = [
    "src",
    "src.common",
    "src.enumerate",
    "src.collector",
    "src.differ",
    "src.scoring",
    "src.report",
    "src.llm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
